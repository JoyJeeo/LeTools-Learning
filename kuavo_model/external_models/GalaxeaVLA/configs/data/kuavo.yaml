# Kuavo dual-arm LeRobot v3 data in the canonical KLS 16D layout:
# [left_arm(7), left_gripper(1), right_arm(7), right_gripper(1)].
_target_: g05.data.mixture_lerobot_dataset.MixtureLerobotDataset
use_weight_normalization: true
use_weight_for_sampling: false
action_size: 32
past_action_size: 0
obs_size: 1
obs_stride_second: 0.0
val_set_proportion: 0.01
is_training_set: true

processors:
  kuavo:
    shape_meta: &kuavo_shape_meta
      action:
      - {key: left_arm, lerobot_key: action, start_index: 0, raw_shape: 7, shape: 7, time_offset: 0}
      - {key: left_gripper, lerobot_key: action, start_index: 7, raw_shape: 1, shape: 1, time_offset: 0}
      - {key: right_arm, lerobot_key: action, start_index: 8, raw_shape: 7, shape: 7, time_offset: 0}
      - {key: right_gripper, lerobot_key: action, start_index: 15, raw_shape: 1, shape: 1, time_offset: 0}
      state:
      - {key: left_arm, lerobot_key: observation.state, start_index: 0, raw_shape: 7, shape: 7, time_offset: 0}
      - {key: left_gripper, lerobot_key: observation.state, start_index: 7, raw_shape: 1, shape: 1, time_offset: 0}
      - {key: right_arm, lerobot_key: observation.state, start_index: 8, raw_shape: 7, shape: 7, time_offset: 0}
      - {key: right_gripper, lerobot_key: observation.state, start_index: 15, raw_shape: 1, shape: 1, time_offset: 0}
      images:
      - key: head_rgb
        camera_type: exterior
        lerobot_key: observation.images.head_cam_h
        start_index: 0
        raw_shape: [3, 480, 640]
        shape: [3, 224, 224]
        time_offset: 0
      - key: left_wrist_rgb
        camera_type: wrist_left
        lerobot_key: observation.images.wrist_cam_l
        start_index: 0
        raw_shape: [3, 480, 640]
        shape: [3, 224, 224]
        time_offset: 0
      - key: right_wrist_rgb
        camera_type: wrist_right
        lerobot_key: observation.images.wrist_cam_r
        start_index: 0
        raw_shape: [3, 480, 640]
        shape: [3, 224, 224]
        time_offset: 0
    action_state_transforms:
    - _target_: g05.data_processor.transforms.relative_action.RelativeJointTransform
      keys: [left_arm, right_arm]
    train_transforms:
      head_rgb: ${oc.load:configs/data/_transforms.yaml,train_head}
      left_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,train_wrist}
      right_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,train_wrist}
    val_transforms:
      head_rgb: ${oc.load:configs/data/_transforms.yaml,val}
      left_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,val}
      right_wrist_rgb: ${oc.load:configs/data/_transforms.yaml,val}
    norm_default_mode: z-score-tail
    norm_exception_mode:
      action: {left_gripper: q01/q99, right_gripper: q01/q99}
      state: {left_gripper: q01/q99, right_gripper: q01/q99}
    action_filter:
      _target_: g05.data_processor.transforms.action_filter.BaseActionFilter
    action_state_merger:
      _target_: g05.data_processor.transforms.action_state_merger.PaddingActionMerger
      merge: true
      max_action_shape_meta: ${oc.load:configs/data/parts_meta/r1pro.yaml,parts_meta}
      max_state_shape_meta: ${oc.load:configs/data/parts_meta/r1pro.yaml,parts_meta}
    num_obs_steps: 1
    use_stepwise_action_norm: true
    drop_high_level_prob: 1.0
    use_zh_instruction: false

embodiment_datasets:
  kuavo:
    type: g05.data.base_lerobot_datasetV3.BaseLerobotDatasetV3
    embodiment_type: kuavo
    lerobot_ds_version: '3.0'
    shape_meta: *kuavo_shape_meta
    dataset_groups:
    - weight: 1.0
      dataset_dirs:
      - /media/ruichen/5fe8ed68-6ff6-464f-af10-a89b65c040cf/sim/sim/TASK1-ToySorting/lerobot