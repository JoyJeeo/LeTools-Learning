# @package _global_
defaults:
- override /model: g05
- override /tokenizer: actioncodec
- override /data: kuavo
- _self_

shard_datasets_by_node: false
use_fsdp: false
vlm:
  cotrain: false
  batch_size: ${model.batch_size}
  num_workers: 2
  vlm_batch_ratio: 0.2
  loss_weight: 1.0
datastatics_path: null
logger:
  type: wandb
  mode: offline
  workspace: null
deploy_checkpoint:
  enabled: true

tokenizer:
  vq_config:
    block_wise_autoregressive: false
    block_size: 8
    num_residuals: 2
    rule_based_key_patterns: [gripper]
    rule_based_binarize_threshold: 0.0
    use_group_markers: true
    group_order_shuffle: false
    dropout_noop_parts: true
    absent_key_fill_value: -100.0
    parts_meta:
      left_control: 9
      left_gripper: 1
      right_control: 9
      right_gripper: 1
      lower_body: 7
    model_arch:
      codebook_size: 4096

model:
  pretrained_ckpt: /media/ruichen/5fe8ed68-6ff6-464f-af10-a89b65c040cf/weights/g05/g05-base/checkpoints/model_state_dict.pt
  vision_lr_multiplier: 0.1
  use_pretrained_norm_stats: false
  enable_bf16_training: true
  model_weights_to_bf16: false
  use_8bit_optimizer: true
  batch_size: 1
  grad_accumulation_steps: 8
  num_workers: 4
  prefetch_factor: 2
  max_epochs: 10
  max_steps: null
  learning_rate: 4.0e-05
  warmup_ratio: null
  warmup_steps: 200
  lr_scheduler_type: cosine
  lr_min_ratio: 0.0
  constant_end_ratio: 0.08
  weight_decay: 0.03
  processor:
    vlm_input_action_norm_default_mode: null
    vlm_input_action_norm_exception_mode: null
    tokenizer_params:
      local_files_only: true
    camera_size_config:
      exterior: [256, 256]
      wrist_left: [256, 256]
      wrist_right: [256, 256]
    action_filter:
      _target_: g05.data_processor.transforms.action_filter.DummyActionFilter
    action_state_merger:
      _target_: g05.data_processor.transforms.action_state_merger.GroupedPaddingMerger
      max_action_shape_meta: ${oc.load:configs/data/parts_meta/r1pro.yaml,parts_meta}
      max_state_shape_meta: ${oc.load:configs/data/parts_meta/r1pro.yaml,parts_meta}
      merge_spec: ${oc.load:configs/data/parts_meta/r1pro.yaml,merge_spec}
      merge: true
  model_arch:
    hf_processor_path: /media/ruichen/5fe8ed68-6ff6-464f-af10-a89b65c040cf/weights/g05/qwen3_5_2b_base_processor
    action_dim: 27
    proprio_dim: 27
    checkpoint_vision: true
    checkpoint_vlm: true
    checkpoint_action_expert: true

    fm:
      num_flow_samples: 4
    ar:
      block_wise_autoregressive: false
    predict_cot: false
    input_preprocessor:
      pred_eov: false